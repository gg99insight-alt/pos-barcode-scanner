<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Barcode Scanner</title><style>body{font:16px system-ui;margin:0;background:#f3f6fa;color:#152238}main{max-width:540px;margin:20px auto;padding:16px}section{background:white;padding:18px;border-radius:14px}button{border:0;border-radius:9px;background:#1763c6;color:white;padding:13px;margin:6px 4px 6px 0;font:inherit}input{padding:12px;width:100%;box-sizing:border-box;font:inherit}#reader{width:100%;min-height:240px;background:#101820;border-radius:8px}#status{white-space:pre-wrap}small{color:#536478}</style></head><body><main><section><h2>Scan product barcode</h2><p>Allow camera access in Android Chrome. Hold the barcode inside the frame.</p><div id="reader"></div><p id="status">Tap Start camera.</p><button id="start">Start camera</button><button id="stop">Stop camera</button><label for="manual">Or enter barcode manually</label><input id="manual" inputmode="numeric" autocomplete="off" placeholder="Barcode"><button id="use">Use barcode</button><p><small>If the POS doesn't receive the barcode automatically, copy it and paste into the Barcode field.</small></p><button id="copy">Copy barcode</button></section></main><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
let scanner=null, busy=false;const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;
async function stop(){if(!scanner)return;const s=scanner;scanner=null;try{if(s.isScanning)await s.stop()}catch(e){}try{await s.clear()}catch(e){}}
async function finish(code){code=String(code||'').trim();if(!code){status('Enter or scan a barcode first.');return} $('manual').value=code; await stop();let sent=false;try{if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'STORE_POS_BARCODE',barcode:code},'*');sent=true}}catch(e){}status(sent?'Barcode sent to POS: '+code+'\nReturn to the POS tab.':'Barcode: '+code+'\nCopy it and paste into the POS.');}
$('start').onclick=async()=>{if(busy||scanner)return;busy=true;status('Starting camera…');try{if(typeof Html5Qrcode==='undefined')throw Error('Scanner library unavailable');scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128],verbose:false});await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:130}},code=>{if(busy)return;busy=true;finish(code).finally(()=>busy=false)},()=>{});status('Camera ready. Aim at a barcode.')}catch(e){status('Camera error: '+(e.message||e));await stop()}finally{busy=false}};
$('stop').onclick=()=>stop().then(()=>status('Camera stopped.'));
$('use').onclick=()=>finish($('manual').value);
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('manual').value);status('Copied. Return to POS and paste the barcode.')}catch(e){status('Select and copy the barcode manually.')}};
window.addEventListener('pagehide',()=>{stop()});
</script></body></html>
